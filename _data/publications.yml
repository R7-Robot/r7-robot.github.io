# Publications shown on the homepage (Selected) and the Publications page.
#
# Fields
#   title, authors, venue (short, e.g. "IROS 2026"), year, type (conference | journal | workshop | preprint)
#   image     : thumbnail path
#   url       : where the title links (project page if any, otherwise the paper)
#   badge     : optional highlight, e.g. "Oral" or "Best Paper Award"
#   selected  : rank on the homepage (1 = first). Omit for non-selected papers.
#   summary   : one sentence, shown for selected papers
#   hidden    : true keeps the entry off the site (e.g., during double-blind review)
#   links     : list of {name, url}
#
# Authors: use † for equal contribution and § for mentored work. "Ruiqi Wang" is bolded automatically.

